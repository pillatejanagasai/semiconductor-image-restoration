version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/app/weights
      - ./outputs:/app/outputs
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000

  streamlit:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./weights:/app/weights
      - ./outputs:/app/outputs
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run src.api.streamlit_app.py --server.port 8501 --server.address 0.0.0.0
